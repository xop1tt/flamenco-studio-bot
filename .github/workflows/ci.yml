name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bot
          POSTGRES_PASSWORD: bot
          POSTGRES_DB: bot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bot -d bot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BOT_TOKEN: 123456:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      ADMINS: 123456789
      ENV: development
      TEST_DATABASE_URL: postgresql://bot:bot@localhost:5432/bot
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install application and test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps .
      - name: Check lint and formatting
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Run unit and PostgreSQL integration tests
        run: python -m unittest discover -s tests -v
