x-backend: &backend
  build:
    context: .
  image: flamenco-studio-bot:local
  init: true
  restart: unless-stopped
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "3"

services:
  bot:
    <<: *backend
    env_file:
      - .env
    environment:
      ENV: production
      DATABASE_SSL_MODE: verify-full
      BOT_LOG_DIR: /var/log/flamenco
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    stop_grace_period: 30s
    volumes:
      - bot_logs:/var/log/flamenco

  # Веб-API (src/flamenco_bot/api): тот же образ и код, что и бот, другая
  # команда запуска. Не публикует порт на хост — доступен только контейнеру
  # сайта (отдельный проект FLAMENCO WEBSITE, свой compose.yaml) по имени
  # сервиса `api` в общей docker-сети `flamenco-web` (см. networks ниже).
  # Сайт проксирует к нему /api/* (next.config.ts сайта), так что у системы
  # остаётся одна публичная точка входа.
  api:
    <<: *backend
    command: ["python", "-m", "flamenco_bot.api"]
    env_file:
      - .env
    environment:
      ENV: production
      DATABASE_SSL_MODE: verify-full
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    expose:
      - "8000"
    networks:
      - default
      - web

volumes:
  bot_logs:

networks:
  # Общая сеть с compose-проектом сайта: сайт подключается к ней как
  # external и обращается к API по http://api:8000. Имя фиксированное
  # (без префикса проекта), поэтому backend нужно поднять первым — он и
  # создаёт сеть.
  web:
    name: flamenco-web
