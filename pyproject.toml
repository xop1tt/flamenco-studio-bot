[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flamenco-studio-bot"
version = "0.1.0"
description = "Telegram bot for a flamenco studio"
requires-python = ">=3.9"
dependencies = [
    "aiogram==3.22.0",
    "asyncpg==0.31.0",
    "python-dotenv==1.2.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"flamenco_bot.database" = ["migrations/*.sql"]
