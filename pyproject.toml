[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flamenco-studio-bot"
version = "0.1.0"
description = "Telegram bot for a flamenco studio"
requires-python = ">=3.10"
dependencies = [
    "aiogram==3.31.0",
    "asyncpg==0.31.0",
    "python-dotenv==1.2.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"flamenco_bot.database" = ["migrations/*.sql"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F"]
